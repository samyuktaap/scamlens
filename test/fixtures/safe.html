<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Demonstration Page — ScamLens</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 12px 0; font-size: 24px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🟢 SAFE BENCHMARK</div>
    <h1>Standard Web Page</h1>
    <p>This is a standard, clean page with no deceptive forms, no external credential action, and no urgency keywords. ScamLens should evaluate this page as <strong>SAFE (Threat Score: 0/100)</strong>.</p>
  </div>
</body>
</html>
